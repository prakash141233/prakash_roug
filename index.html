<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #e0eafc, #cfdef3); /* Soft gradient background */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #2c3e50;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #2c3e50; /* Darker shade for main title */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 2px;
        }
        h2 {
            font-size: 1.8em;
            color: #34495e;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            font-size: 1.1em;
            color: white;
            background-color: #5cdb95; /* Soft green for buttons */
            padding: 12px 30px;
            border-radius: 50px; /* Rounded button */
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }
        a:hover {
            background-color: #379683; /* Darker green on hover */
            transform: translateY(-3px); /* Slight lift effect on hover */
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15); /* Deepened shadow */
        }
        a:active {
            background-color: #285943; /* Even darker for active state */
        }
        .experiment {
            margin-bottom: 30px;
            text-align: center;
        }
        .experiment h2 {
            font-size: 1.6em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>IT3511 Full Stack Web Development Lab</h1>
    <h2>List of Experiments</h2>

    <div class="experiment">
        <h2>Ex:1 Portfolio</h2>

    </div>

    <div class="experiment">
        <h2>Ex:2 To-Do List</h2>
        <a href="https://prakash141233.github.io/to-do-app/" target="_blank">Go to To-Do List</a>
    </div>

    <div class="experiment">
        <h2>Ex:3 Microblogging</h2>
        <a href="https://prakash141233.github.io/microblogging/" target="_blank">Go to Microblogging</a>
    </div>

    <div class="experiment">
        <h2>Ex:4 Food Delivery</h2>
        <a href="https://prakash141233.github.io/food-website/" target="_blank">Go to Food Website</a>
    </div>  
    
     <div class="experiment">
        <h2>Ex:5 Buy and Sell Products</h2>
        <a href=" https://prakash141233.github.io/buy-and-sell/" target="_blank">Go to Website</a>
    </div>
</body>
</html>
